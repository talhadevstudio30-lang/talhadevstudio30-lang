# Contribution Snake - neon edition
# Place this file in the profile repository at .github/workflows/snake.yml.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark and light, neon palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#5b4ee8&color_dots=#f1efff,#e7e3ff,#c4c0ff,#7a6ef0,#5b4ee8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c4c0ff&color_dots=#1c1b1b,#35315f,#5b4ee8,#7a6ef0,#c4c0ff

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
